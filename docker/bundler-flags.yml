---
# Project-local behavior flags (optional seed). Paths for the shared volume
# live in the *user* config: home/.bundle/config → ~/.bundle/config in the image
# (BUNDLE_PATH / BUNDLE_CACHE_PATH under /cache). Prefer that file so compose
# need not pass BUNDLE_* at runtime.
#
# BUNDLE_PATH is a shared volume across apps — never auto-clean: one Gemfile
# must not remove gems still needed by another project on the same cache.
BUNDLE_CACHE_ALL: "true"
BUNDLE_CACHE_ALL_PLATFORMS: "true"
BUNDLE_CLEAN: "false"
BUNDLE_NO_PRUNE: "true"
BUNDLE_DISABLE_SHARED_GEMS: "true"
BUNDLE_JOBS: "4"
BUNDLE_RETRY: "3"
